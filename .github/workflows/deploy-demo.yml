name: Deploy demo

on:
  push:
    branches: [main]

concurrency:
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      # The demo imports other workspace packages (e.g. @velkren/react-adapter)
      # by their `exports` field, which points at `dist/` -- so those packages
      # must be built first, or a fresh checkout has nothing to resolve.
      - run: npm run build
      - run: npm run build --workspace=packages/demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
